<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="shortcut icon" href="assets/logoicon.png" type="image/x-icon" />
    <title>VibeNet</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <nav
      class="navbar navbar-expand-lg border-bottom border-secondary sticky-top bgdark"
    >
      <div class="container">
        <div class="row w-100 align-items-center g-0">
          <div class="col-4 d-flex justify-content-start">
            <div class="user-profile-circle shadow-cyan" id="icon"></div>
          </div>

          <div class="col-4 d-flex justify-content-center">
            <img
              src="assets/logoicon.png"
              alt="VibeNet Logo"
              class="img-fluid logo-nav"
            />
          </div>

          <div class="col-4 d-flex justify-content-end">
            <button
              class="btn btn-link text-decoration-none text-light opacity-75 hover-cyan fw-semibold py-1 px-3 logbtn"
              onclick="logout()"
            >
              Logout
            </button>
          </div>
        </div>
      </div>
    </nav>

    <div class="container mt-4 mt-lg-5">
      <div class="row g-4">
        <div class="col-lg-4">
          <div class="postCard p-4 shadow-sm sticky-lg-top" style="top: 100px">
            <h5 class="text-white mb-4 fw-bold">Share Your Vibe</h5>
            <form id="post-form">
              <div class="mb-3">
                <input
                  type="text"
                  id="title"
                  class="form-control custom-input"
                  placeholder="Post Title"
                />
              </div>
              <div class="mb-3">
                <textarea
                  id="body"
                  rows="4"
                  class="form-control custom-input"
                  placeholder="What's on your mind?"
                ></textarea>
              </div>
              <div class="mb-3 imgContainer">
                <img
                  src="assets/bg1.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg1.jpg', event)"
                />
                <img
                  src="assets/bg2.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg2.jpg', event)"
                />
                <img
                  src="assets/bg3.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg3.jpg', event)"
                />
                <img
                  src="assets/bg4.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg4.jpg', event)"
                />
                <img
                  src="assets/bg5.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg5.jpg', event)"
                />
                <img
                  src="assets/bg6.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg6.jpg', event)"
                />
                <img
                  src="assets/bg7.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg7.jpg', event)"
                />
                <img
                  src="assets/bg8.jpg"
                  alt=""
                  class="bgimg"
                  onclick="addClass('assets/bg8.jpg', event)"
                />
              </div>
              <button
                type="button"
                id="upBtn"
                onclick="sumbitPost()"
                class="btn btn-cyan w-100 fw-bold py-2 shadow-sm"
              >
                Post Now
              </button>
            </form>
          </div>
        </div>

        <div class="col-lg-8">
          <h5 class="text-white mb-4 fw-bold">Recent Feeds</h5>

          <div id="post">
            <div class="cardWraper">
              <div
                class="postCard p-4 mb-4 border-0 shadow-sm"
                style="
                  background-image: url(&quot;assets/bg3.jpg&quot;);
                  background-attachment: fixed;
                  background-size: cover;
                  background-position: center;
                "
              >
                <div class="d-flex align-items-center mb-3">
                  <div class="user-profile-circle me-3 bg-info">ZK</div>
                  <div>
                    <h6 class="mb-0 text-white fw-bold">Zunaira Khan</h6>
                    <span class="post-meta small color"
                      >Posted 2 hours ago</span
                    >
                  </div>
                </div>
                <h5 class="text-cyan mb-2">React.js is King! 👑</h5>
                <p class="text-light opacity-75">
                  Working on a new project with React and Supabase. The
                  developer experience is just next level.
                </p>
              </div>
              <div class="py-3 border-top border-secondary d-flex gap-4">
                <button
                  class="btn color p-0 text-decoration-none small"
                  onclick="colorChange(this)"
                >
                  Like
                </button>

                <div class="d-flex gap-4 ms-auto">
                  <button
                    class="btn color p-0 text-decoration-none small"
                    onclick="editPost(this)"
                  >
                    Edit
                  </button>

                  <button
                    class="btn color p-0 text-decoration-none small"
                    onclick="deletePost(this)"
                  >
                    Delete
                  </button>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js"
      integrity="sha512-4F1cxYdMiAW98oomSLaygEwmCnIP38pb4Kx70yQYqRwLVCs3DbRumfBq82T08g/4LJ/smbFGFpmeFlQgoDccgg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
    <script src="app.js"></script>
  </body>
</html>
