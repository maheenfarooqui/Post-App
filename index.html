<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>VibeNet - SinUp</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container-fluid login-container vh-100">
      <div class="row h-100">
        <div
          class="col-12 col-lg-6 d-flex flex-column justify-content-center align-items-center branding-section p-lg-5"
        >
          <div class="brand-visual mb-lg-4">
            <img
              src="assets/logo.png"
              alt="VibeNet Logo"
              class="img-fluid login-logo"
            />
          </div>
        </div>

        <div
          class="col-12 col-lg-6 d-flex align-items-center justify-content-center login-form-section"
        >
          <div
            class="card bg-transparent border-0 w-100 px-3"
            style="max-width: 500px"
          >
            <div class="card-body">
              <h2 class="text-white mb-2 text-center text-lg-start">
                Create Account
              </h2>
              <p class="color mb-4 text-center text-lg-start">
                Join the VibeNet community today.
              </p>

              <form>
                <div class="row mb-3">
                  <div class="col-md-6">
                    <label class="form-label text-light small"
                      >First Name</label
                    >
                    <input
                      type="text"
                      id="userN"
                      class="form-control custom-input"
                      placeholder="Maheen"
                      required
                    />
                  </div>
                  <div class="col-md-6 mt-3 mt-md-0">
                    <label class="form-label text-light small">Surname</label>
                    <input
                      type="text"
                      id="userL"
                      class="form-control custom-input"
                      placeholder="Zuhra"
                      required
                    />
                  </div>
                </div>

                <div class="mb-3">
                  <label class="form-label text-light small"
                    >Email Address</label
                  >
                  <input
                    type="email"
                    id="userE"
                    class="form-control custom-input"
                    placeholder="email@example.com"
                    required
                  />
                </div>

                <div class="mb-3">
                  <label class="form-label text-light small">Password</label>
                  <input
                    type="password"
                    id="userP"
                    class="form-control custom-input"
                    placeholder="********"
                    required
                  />
                </div>

                <div class="row mb-4">
                  <div class="col-md-6">
                    <label class="form-label text-light small"
                      >Date of Birth</label
                    >
                    <input
                      type="date"
                      class="form-control custom-input"
                      required
                    />
                  </div>
                  <div class="col-md-6 mt-3 mt-md-0">
                    <label class="form-label text-light small">Gender</label>
                    <select class="form-select custom-input" required>
                      <option selected disabled>Select Gender</option>
                      <option value="male">Male</option>
                      <option value="female">Female</option>
                    </select>
                  </div>
                </div>

                <button
                  type="button"
                  class="btn btn-cyan w-100 py-3 fw-bold mb-4"
                  id="sinUp"
                >
                  Sign Up
                </button>

                <div class="text-center">
                  <p class="color small">
                    Already have an account?
                    <a
                      href="login.html"
                      class="text-white text-decoration-underline"
                      >Log In</a
                    >
                  </p>
                </div>
              </form>
            </div>
          </div>
        </div>
      </div>
    </div>
    <script
      src="https://cdnjs.cloudflare.com/ajax/libs/moment.js/2.30.1/moment-with-locales.min.js"
      integrity="sha512-4F1cxYdMiAW98oomSLaygEwmCnIP38pb4Kx70yQYqRwLVCs3DbRumfBq82T08g/4LJ/smbFGFpmeFlQgoDccgg=="
      crossorigin="anonymous"
      referrerpolicy="no-referrer"
    ></script>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  

    <script src="auth.js" type="module"></script>
  </body>
</html>
